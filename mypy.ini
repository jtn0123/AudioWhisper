# Static type checking for the bundled Python.
#
# `Sources/ml/` is the only code in this repo that ships without a compiler in
# front of it: 574 lines running in a subprocess, reached across a JSON-RPC
# boundary, with a single unit test. Before this file existed nothing checked it
# at all — and `--strict` immediately found `_set_offline_env` returning
# `dict[str, str | None]` through an annotation that claimed `dict[str, str]`.
#
# Enforced by `make typecheck` and the `python-typecheck` CI job.

[mypy]
python_version = 3.11
files = Sources/ml, Sources/ml_daemon.py, Sources/verify_mlx.py, Sources/verify_parakeet.py
strict = True
pretty = True

# The ML stack is untyped and, more to the point, is NOT installed in the
# checkout that runs this check — it lives in the uv-managed venv the app
# builds at runtime (ADR 0002), which is multi-gigabyte and not something CI
# should materialise just to typecheck 574 lines.
#
# These exemptions are deliberately per-module rather than a blanket
# `ignore_missing_imports = True`: a NEW untyped dependency should fail this
# check and be a decision, not something that slides in unnoticed.
[mypy-mlx.*]
ignore_missing_imports = True

[mypy-mlx_lm.*]
ignore_missing_imports = True

[mypy-parakeet_mlx.*]
ignore_missing_imports = True

[mypy-numpy]
ignore_missing_imports = True
