name: Nightly

# ParakeetEndToEndTests carried the comment "CI runs this nightly only; per-PR
# runs skip it via XCTSkip below" — but no scheduled workflow existed. The app's
# PRIMARY transcription path (download the model, bootstrap the uv venv, run
# Python, get text back) therefore had ZERO automated coverage; every other test
# mocks the daemon.
#
# Kept out of the per-PR run deliberately: the first execution downloads a
# Parakeet, Whisper, and correction model weights, adding minutes to every PR.
on:
  schedule:
    # 07:00 UTC daily.
    - cron: '0 7 * * *'
  workflow_dispatch:      # so it can be run on demand without waiting a day
    inputs:
      cold_whisper:
        description: Download Whisper assets afresh to investigate cache-dependent inference failures
        type: boolean
        default: false

jobs:
  parakeet-e2e:
    name: Local engines (Parakeet v2/v3, Whisper, lightweight MLX)
    runs-on: macos-15
    # Generous: a cold run downloads the model and builds the uv environment.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Newest Xcode: KeyboardShortcuts 3.x needs swift-tools-version 6.2,
          # which Xcode 16 cannot resolve. See ci.yml for the full note.
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          swift --version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # The model is the expensive part. Keyed on the pinned repo id so a model
      # change busts the cache.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Sources/Models/ModelPins.swift') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Cache Whisper models
        if: inputs.cold_whisper != true
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/AudioWhisper Rebuild/Whisper
          key: whisper-rebuild-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}

      - name: Cache uv Python environment
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/AudioWhisper Rebuild/python_project
          key: uv-rebuild-${{ runner.os }}-${{ hashFiles('Sources/Resources/uv.lock') }}
          restore-keys: uv-rebuild-${{ runner.os }}-

      - name: Prepare verified uv
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64 || { echo "::error::Real MLX tests require an Apple Silicon runner."; exit 1; }
          scripts/prepare-uv.sh
          echo "$GITHUB_WORKSPACE/Sources/Resources/bin" >> "$GITHUB_PATH"

      - name: Generate VersionInfo.swift
        run: |
          UV_VERSION=$(Sources/Resources/bin/uv --version | awk '{print $2}')
          UV_SHA=$(shasum -a 256 Sources/Resources/bin/uv | awk '{print $1}')
          VERSION=$(tr -d '[:space:]' < VERSION 2>/dev/null || echo "0.0.0")
          sed -e "s/BUNDLED_UV_VERSION_PLACEHOLDER/$UV_VERSION/g" \
              -e "s/BUNDLED_UV_SHA256_PLACEHOLDER/$UV_SHA/g" \
              -e "s/VERSION_PLACEHOLDER/$VERSION/g" \
              -e "s/GIT_HASH_PLACEHOLDER/$(git rev-parse --short HEAD)/g" \
              -e "s/BUILD_DATE_PLACEHOLDER/$(date -u +%Y-%m-%d)/g" \
              Sources/VersionInfo.swift.template > Sources/Utilities/VersionInfo.swift

      - name: Run all real local engine fixtures
        env:
          RUN_E2E: "1"
          OS_ACTIVITY_MODE: disable
        run: |
          # RUN_E2E=1 is what lifts the XCTSkipUnless gate in
          # Tests/Integration/ParakeetEndToEndTests.swift.
          set -o pipefail
          swift test --no-parallel -Xswiftc -DTESTING \
            --filter "ParakeetEndToEndTests|LocalEngineFixtureTests" 2>&1 | tee real-engine-tests.log

      # CurrentWritingModelFixtureTests is run with scripts/test-current-models.sh
      # on a provisioned >=32 GB Apple Silicon Mac. The standard hosted runner
      # has 7 GB RAM and cannot accept the 13 GB Qwen 3.8 model. Do not count
      # this smaller scheduled suite as acceptance of the larger writing models.

      - name: Preserve real-engine diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-engine-diagnostics
          path: real-engine-tests.log

      - name: Report
        if: failure()
        run: |
          echo "::error::Real local engine verification failed. Inspect whether bootstrap,"
          echo "::error::model download, actual inference, or warm reuse failed."
