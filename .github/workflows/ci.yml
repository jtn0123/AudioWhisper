name: CI

on:
  push:
    # I4: dropped 'grade-report-sweep', a one-off branch from a May 2026 audit
    # that no longer exists. Replaced the ad-hoc list with globs that cover the
    # working-branch conventions actually in use, so CI runs on feature branches
    # without needing this list edited every time.
    branches:
      - main
      - master
      - 'claude/**'
      - 'grade-fixes-**'
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode || true

      - name: Select Xcode
        run: |
          # Select the NEWEST Xcode, not the newest 16.x. This used to pin to
          # Xcode_16*, written when 16 was current — but KeyboardShortcuts 3.x
          # declares swift-tools-version 6.2, which Xcode 16 cannot resolve
          # ("incompatible tools version"). Runners carry Xcode 26.x alongside
          # 16.x, so take the highest available and let the floor be enforced by
          # the packages themselves.
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest/Contents/Developer"
          else
            echo "No Xcode 16 found; using default"
            xcode-select -p
          fi

      - name: Show Swift Version
        run: swift --version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Generate VersionInfo.swift
        run: |
          # VersionInfo.swift is gitignored and normally produced by
          # scripts/build.sh. Bare `swift build`/`swift test` need it too.
          VERSION=$(tr -d '[:space:]' < VERSION 2>/dev/null || echo "0.0.0")
          GIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "ci-build")
          BUILD_DATE=$(date -u +%Y-%m-%d)
          # BUNDLED_UV_* placeholders must be substituted before VERSION_PLACEHOLDER,
          # which is a substring of BUNDLED_UV_VERSION_PLACEHOLDER.
          sed -e "s/BUNDLED_UV_VERSION_PLACEHOLDER//g" \
              -e "s/BUNDLED_UV_SHA256_PLACEHOLDER//g" \
              -e "s/VERSION_PLACEHOLDER/$VERSION/g" \
              -e "s/GIT_HASH_PLACEHOLDER/$GIT_HASH/g" \
              -e "s/BUILD_DATE_PLACEHOLDER/$BUILD_DATE/g" \
              Sources/VersionInfo.swift.template > Sources/Utilities/VersionInfo.swift
          echo "Generated Sources/Utilities/VersionInfo.swift"

      - name: Build
        run: swift build

      - name: Run Tests
        run: |
          # D4: runs in PARALLEL. This used to be forced sequential because tests
          # wrote UserDefaults.standard while production read the same global
          # domain, so parallel xctest processes raced the same keys.
          # AppDefaults.defaults is now redirectable and appends the process id,
          # giving each worker its own settings store; every settings access,
          # production and test, goes through it.
          #
          # Coverage still needs --no-parallel: llvm merges one .profraw per
          # process and parallel workers race the same file.
          set +e
          swift test --parallel 2>&1 | tee /tmp/test_output.txt
          PARALLEL_EXIT=${PIPESTATUS[0]}
          if [ "$PARALLEL_EXIT" -ne 0 ]; then
            grep -v -E "(CNAccountCollection|ContactsPersistence|com\.apple\.contacts|NSXPCConnection|DetachedSignatures|FrontBoardServices|NSStatusItemScene|BSBlockSentinel)" /tmp/test_output.txt || true
            exit $PARALLEL_EXIT
          fi
          # Second pass, sequential, purely to produce coverage data.
          swift test --no-parallel --enable-code-coverage 2>&1 | tee /tmp/test_output.txt
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          # Filter and display cleaned output
          grep -v -E "(CNAccountCollection|ContactsPersistence|com\.apple\.contacts|NSXPCConnection|DetachedSignatures|FrontBoardServices|NSStatusItemScene|BSBlockSentinel|NSStatusItem|assertOnQueue)" /tmp/test_output.txt || true
          exit $TEST_EXIT_CODE
        env:
          OS_ACTIVITY_MODE: disable

      - name: Coverage summary
        if: always()
        run: |
          set +e
          PROFDATA=$(find .build -name '*.profdata' | head -n 1)
          BIN_DIR=$(find .build -type d -name '*.xctest' | head -n 1)
          if [ -n "$PROFDATA" ] && [ -n "$BIN_DIR" ]; then
            BIN=$(find "$BIN_DIR/Contents/MacOS" -type f | head -n 1)
            xcrun llvm-cov report "$BIN" -instr-profile "$PROFDATA" 2>/dev/null | tail -n 1 || true
          else
            echo "No coverage data found"
          fi

      - name: Coverage threshold gate
        if: always()
        run: |
          set +e
          PROFDATA=$(find .build -name '*.profdata' | head -n 1)
          BIN_DIR=$(find .build -type d -name '*.xctest' | head -n 1)
          if [ -z "$PROFDATA" ] || [ -z "$BIN_DIR" ]; then
            echo "No coverage data — skipping threshold check"
            exit 0
          fi
          BIN=$(find "$BIN_DIR/Contents/MacOS" -type f | head -n 1)
          # Pull the line-coverage percentage from the TOTAL line
          PCT=$(xcrun llvm-cov report "$BIN" -instr-profile "$PROFDATA" 2>/dev/null | tail -n 1 | awk '{print $(NF-1)}' | tr -d '%')
          if [ -z "$PCT" ]; then
            echo "Could not parse coverage percent; skipping"
            exit 0
          fi
          echo "Line coverage: $PCT%"
          THRESHOLD=60
          # bash's [ ] doesn't do float comparison; cast to int for the check
          PCT_INT=${PCT%.*}
          if [ "$PCT_INT" -lt "$THRESHOLD" ]; then
            echo "::error::Line coverage $PCT% below threshold $THRESHOLD%"
            exit 1
          fi
          echo "Coverage $PCT% >= threshold $THRESHOLD%"

  lint:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew list swiftlint >/dev/null 2>&1 || brew install swiftlint

      - name: SwiftLint (strict)
        run: swiftlint --strict --reporter github-actions-logging

      - name: No print() outside #if DEBUG
        run: |
          set -e
          violations=$(grep -rn --include='*.swift' -E '^\s*print\(' Sources/ | grep -v '//.*print' || true)
          # Filter out lines that appear inside a #if DEBUG block by checking surrounding lines.
          #
          # NOTE: the loop reads from a process substitution rather than a pipe.
          # `echo "$violations" | while ...` runs the loop body in a SUBSHELL, so
          # an `exit 1` inside it only terminates that subshell — the step then
          # falls through to the success echo and exits 0. This gate silently
          # passed on every run until that was fixed.
          failed=0
          if [ -n "$violations" ]; then
            while IFS=: read -r file line _rest; do
              [ -n "$file" ] || continue
              # Search 50 lines back for #if DEBUG, then check if a #endif came between
              ctx=$(sed -n "1,${line}p" "$file" | tail -n 50)
              last_debug=$(echo "$ctx" | grep -n '#if DEBUG' | tail -n 1 | cut -d: -f1 || true)
              last_endif=$(echo "$ctx" | grep -n '#endif' | tail -n 1 | cut -d: -f1 || true)
              if [ -z "$last_debug" ] || { [ -n "$last_endif" ] && [ "$last_endif" -gt "$last_debug" ]; }; then
                echo "::error file=$file,line=$line::print() outside #if DEBUG"
                failed=1
              fi
            done < <(echo "$violations")
          fi
          if [ "$failed" -ne 0 ]; then
            echo "Production print() found — wrap in #if DEBUG or use Logger."
            exit 1
          fi
          echo "No production print() found"

      - name: Python lockfile is in sync with pyproject.toml
        run: |
          # UvBootstrap ships uv.lock and installs with `uv sync --frozen`, which
          # never re-resolves. `--frozen` does NOT verify the lock matches
          # pyproject.toml, so drift would ship as a dependency that silently
          # fails to install. `uv lock --check` is the assertion that catches it.
          set -e
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
          fi
          cd Sources/Resources
          if [ ! -f uv.lock ]; then
            echo "::error::Sources/Resources/uv.lock is missing. Run 'uv lock' there."
            exit 1
          fi
          uv lock --check || {
            echo "::error::uv.lock is out of date with pyproject.toml. Run 'uv lock' in Sources/Resources and commit the result."
            exit 1
          }
          echo "uv.lock is in sync with pyproject.toml"

      - name: Python unit tests
        run: |
          # Tests/test_correction_sanitize.py guards sanitize_model_output, the
          # function that decides whether a correction survives safeMerge or gets
          # silently thrown away. Every fixture in it is a verbatim capture of a
          # model output that DID get discarded, so a regression here is a silent
          # quality loss with no error anywhere.
          #
          # These were unreferenced by any workflow until now. They import
          # ml.correction, whose mlx imports are lazy, so plain system python is
          # enough — no uv, no venv, no model download.
          set -e
          python3 Tests/test_correction_sanitize.py

      - name: TODO/FIXME audit (warn only)
        run: |
          grep -rn "TODO\|FIXME" Sources/ --include='*.swift' || echo "No TODO/FIXME comments found"

  bundle-smoke-test:
    needs: build-and-test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Select the NEWEST Xcode, not the newest 16.x. This used to pin to
          # Xcode_16*, written when 16 was current — but KeyboardShortcuts 3.x
          # declares swift-tools-version 6.2, which Xcode 16 cannot resolve
          # ("incompatible tools version"). Runners carry Xcode 26.x alongside
          # 16.x, so take the highest available and let the floor be enforced by
          # the packages themselves.
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest/Contents/Developer"
          else
            xcode-select -p
          fi

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build .app bundle via make build
        run: make build

      - name: Verify bundle structure
        run: |
          set -e
          APP="AudioWhisper.app"
          test -d "$APP" || { echo "::error::Missing $APP"; exit 1; }
          test -x "$APP/Contents/MacOS/AudioWhisper" || { echo "::error::Missing executable"; exit 1; }
          test -f "$APP/Contents/Info.plist" || { echo "::error::Missing Info.plist"; exit 1; }
          plutil -lint "$APP/Contents/Info.plist"
          # Confirm Python bootstrap binary made it into the bundle
          test -f "$APP/Contents/Resources/bin/uv" -o -f "$APP/Contents/Resources/uv" \
            || echo "::warning::uv binary not found in bundled Resources (may be missing for dev builds)"
          # Confirm version was stamped (not left as a placeholder)
          if grep -q "VERSION_PLACEHOLDER\|BUILD_PLACEHOLDER" "$APP/Contents/MacOS/AudioWhisper" 2>/dev/null; then
            echo "::warning::Version placeholders found unsubstituted in binary"
          fi
          echo "App bundle smoke test passed."

      - name: Show bundle size
        run: |
          du -sh AudioWhisper.app
          ls -lh AudioWhisper.app/Contents/MacOS/AudioWhisper

  # The snapshot suite (36 committed baselines) is skipped unless SNAPSHOT_TESTS=1,
  # and nothing ever set it — so the visual-regression net has never run in CI.
  # Turning it on found a real crash: DialWaveformView trapped on an empty
  # frequencyBands array (fixed in this branch, now covered by a direct render
  # test in WaveformViewsTests).
  #
  # REPORT-ONLY, and it cannot become blocking until the baselines are
  # regenerated ON THIS RUNNER. The comparison is exact-match on RGBA bytes, and
  # the committed baselines were recorded on a different macOS/Xcode; 14 of the
  # 36 differ purely from environment. Three (Waveform-halo-dark,
  # -heartbeat-dark, -stream-dark) have no committed baseline at all.
  #
  # To adopt: run this job, download the `snapshot-renders` artifact, commit the
  # PNGs into Tests/__Snapshots__/, then drop continue-on-error and move
  # SNAPSHOT_TESTS=1 into the main test job.
  snapshots:
    name: UI snapshots (report-only)
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Select the NEWEST Xcode, not the newest 16.x. This used to pin to
          # Xcode_16*, written when 16 was current — but KeyboardShortcuts 3.x
          # declares swift-tools-version 6.2, which Xcode 16 cannot resolve
          # ("incompatible tools version"). Runners carry Xcode 26.x alongside
          # 16.x, so take the highest available and let the floor be enforced by
          # the packages themselves.
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi

      - name: Generate VersionInfo.swift
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION 2>/dev/null || echo "0.0.0")
          sed -e "s/BUNDLED_UV_VERSION_PLACEHOLDER//g" \
              -e "s/BUNDLED_UV_SHA256_PLACEHOLDER//g" \
              -e "s/VERSION_PLACEHOLDER/$VERSION/g" \
              -e "s/GIT_HASH_PLACEHOLDER/$(git rev-parse --short HEAD)/g" \
              -e "s/BUILD_DATE_PLACEHOLDER/$(date -u +%Y-%m-%d)/g" \
              Sources/VersionInfo.swift.template > Sources/Utilities/VersionInfo.swift

      # Build FIRST, and let a build failure fail the job. Without this the two
      # `|| true` steps below hid a dependency-resolution failure completely: the
      # job went green, rendered nothing, and uploaded the repo's own committed
      # baselines as if they were fresh CI renders. A false green that produces a
      # plausible-looking artifact is worse than a red build.
      - name: Build tests
        run: swift build --build-tests

      - name: Run snapshot tests (report-only)
        env:
          SNAPSHOT_TESTS: "1"
          OS_ACTIVITY_MODE: disable
        run: swift test --no-parallel -Xswiftc -DTESTING --filter "UISnapshotTests" || true

      - name: Render baselines on this runner
        env:
          SNAPSHOT_RECORD: "1"
          OS_ACTIVITY_MODE: disable
        run: |
          # Clear the committed baselines first so anything left in the directory
          # is unambiguously rendered by THIS runner.
          rm -f Tests/__Snapshots__/*.png
          # SNAPSHOT_RECORD deliberately fails each test after writing its image,
          # so a nonzero exit here is expected; we only want the PNGs.
          swift test --no-parallel -Xswiftc -DTESTING --filter "UISnapshotTests" || true

          count=$(ls Tests/__Snapshots__/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "rendered $count snapshot(s)"
          if [ "$count" -lt 30 ]; then
            echo "::error::Only $count snapshots rendered (expected ~39). The artifact"
            echo "::error::would be incomplete, so failing rather than publishing it."
            exit 1
          fi

      # DIAGNOSTIC ONLY — these are not baselines. Measured 2026-08-01: every
      # one of the 34 renders this job produced diverged from the locally
      # recorded baseline by 19-100% of pixels, because the runner draws
      # AppKit-backed controls as the yellow "cannot render" placeholder. Keep
      # them for eyeballing a CI-only rendering question; never commit them.
      - name: Upload renders (diagnostic only, NOT baselines)
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-renders-diagnostic
          path: Tests/__Snapshots__/
          if-no-files-found: error

  # SwiftLint's analyzer rules (unused_declaration, unused_import) are configured
  # in .swiftlint.yml but only run under `swiftlint analyze`, never `swiftlint
  # lint`. They had therefore never executed — which is how a 160-line
  # DependencyContainer with zero call sites survived in the codebase.
  #
  # PARTIALLY GATED. `unused_import` is enforced (backlog triaged to zero against
  # the compiler); `unused_declaration` is reported only — see the note on its
  # step below for why.
  analyze:
    name: SwiftLint analyze
    runs-on: macos-15
    # xcodebuild build-for-testing plus a full analyze pass. 30 was too tight
    # even after dropping from three analyze runs to one.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Select the NEWEST Xcode, not the newest 16.x. This used to pin to
          # Xcode_16*, written when 16 was current — but KeyboardShortcuts 3.x
          # declares swift-tools-version 6.2, which Xcode 16 cannot resolve
          # ("incompatible tools version"). Runners carry Xcode 26.x alongside
          # 16.x, so take the highest available and let the floor be enforced by
          # the packages themselves.
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          swift --version

      - name: Install SwiftLint
        run: brew list swiftlint >/dev/null 2>&1 || brew install swiftlint

      - name: Generate VersionInfo.swift
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION 2>/dev/null || echo "0.0.0")
          sed -e "s/BUNDLED_UV_VERSION_PLACEHOLDER//g" \
              -e "s/BUNDLED_UV_SHA256_PLACEHOLDER//g" \
              -e "s/VERSION_PLACEHOLDER/$VERSION/g" \
              -e "s/GIT_HASH_PLACEHOLDER/$(git rev-parse --short HEAD)/g" \
              -e "s/BUILD_DATE_PLACEHOLDER/$(date -u +%Y-%m-%d)/g" \
              Sources/VersionInfo.swift.template > Sources/Utilities/VersionInfo.swift

      - name: Build with xcodebuild (analyzer needs a compiler log)
        run: |
          # `swift build -v` does NOT emit a log swiftlint can parse — SPM's new
          # build system omits the per-file swiftc invocations the analyzer
          # reads, and it errors with "Cannot index file at path ...".
          # xcodebuild does produce a compatible log. build-for-testing is used
          # so Tests/ are included; without them every *ForTesting helper is
          # reported as unused.
          set -o pipefail
          xcodebuild -scheme AudioWhisper -destination 'platform=macOS' \
            build-for-testing 2>&1 | tee xcodebuild.log | tail -5

      - name: Analyze (single pass)
        run: |
          # ONE analyze run, saved to a file that the summary and the gate below
          # both read. This used to invoke `swiftlint analyze` three times —
          # twice here, once in the gate — and each pass over 355 files takes
          # ~10 minutes. The job took 28.5 minutes when it passed and was killed
          # by its own 30-minute timeout when it did not. The gate step was the
          # one cancelled, so the job reported "cancelled" rather than anything
          # that pointed at the real cause.
          swiftlint analyze --compiler-log-path xcodebuild.log \
            --reporter github-actions-logging 2>/dev/null | tee analyze.txt || true
          echo "--- summary ---"
          grep -oE '\((unused_declaration|unused_import)\)' analyze.txt | sort | uniq -c || true

      - name: Gate on unused_import
        run: |
          # unused_import IS enforced. The backlog was triaged by removing each
          # flagged import and rebuilding — the compiler, not the analyzer, is
          # the oracle. 95 were genuinely unused and removed; 20 were false
          # positives (umbrella imports like Cocoa, modules needed only for @objc
          # or a type in a signature, and `@testable import AudioWhisper`) and
          # carry an inline swiftlint:disable:next with that justification.
          # The rule now reports 0, so any new finding is real.
          # Reads the single analyze pass above; does not re-run it.
          count=$(grep -c '(unused_import)' analyze.txt || true)
          if [ "${count:-0}" -ne 0 ]; then
            # analyze.txt holds the reporter's raw "::warning file=...,line=..."
            # lines. GitHub turns those into annotations and hides the file path
            # from the log, so the first time this gate fired it said only that
            # ONE import was unused, with no way to tell which. Neutralise the
            # "::" prefix so the paths actually print.
            echo "offending imports:"
            grep '(unused_import)' analyze.txt | sed 's/^:://' | sed 's/^/  /'
          fi
          if [ "${count:-0}" -ne 0 ]; then
            echo "::error::$count unused import(s). Remove them, or if the compiler"
            echo "::error::genuinely needs one, add swiftlint:disable:next with a reason."
            exit 1
          fi
          echo "unused_import: 0"

      # unused_declaration is NOT gated yet. 215 findings, and 87 of those are in
      # Tests/Mocks — mock members that satisfy a protocol and are only ever
      # called through it, which the analyzer cannot see. Gating on that would
      # fail every build for reasons that are not defects. Triaging the ~128
      # remaining is real work and carries real risk (deleting something reached
      # via protocol or dynamic dispatch), so it stays reported-only until
      # someone works it down.
