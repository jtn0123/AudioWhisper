name: CI

# Single source of truth for the SwiftLint version. Both the lint job and the
# analyze job pin to it; see "Install SwiftLint (pinned)".
env:
  SWIFTLINT_VERSION: "0.65.0"
  # Read back by scripts/typecheck.sh so a local run warns when it drifts.
  # mypy adds checks in minor releases, so an unpinned upgrade would fail the
  # build for nobody's mistake.
  MYPY_VERSION: "1.20.0"
  COVERAGE_VERSION: "7.16.1"

on:
  push:
    # I4: dropped 'grade-report-sweep', a one-off branch from a May 2026 audit
    # that no longer exists. Replaced the ad-hoc list with globs that cover the
    # working-branch conventions actually in use, so CI runs on feature branches
    # without needing this list edited every time.
    branches:
      - main
      - master
      - 'claude/**'
      - 'grade-fixes-**'
      - 'fix/**'
      - 'feat/**'
      - 'rebuild/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode || true

      - name: Select Xcode
        run: |
          # Select the NEWEST Xcode, not the newest 16.x. This used to pin to
          # Xcode_16*, written when 16 was current — but KeyboardShortcuts 3.x
          # declares swift-tools-version 6.2, which Xcode 16 cannot resolve
          # ("incompatible tools version"). Runners carry Xcode 26.x alongside
          # 16.x, so take the highest available and let the floor be enforced by
          # the packages themselves.
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest/Contents/Developer"
          else
            echo "No Xcode 16 found; using default"
            xcode-select -p
          fi

      - name: Show Swift Version
        run: swift --version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Generate VersionInfo.swift
        run: |
          # VersionInfo.swift is gitignored and normally produced by
          # scripts/build.sh. Bare `swift build`/`swift test` need it too.
          VERSION=$(tr -d '[:space:]' < VERSION 2>/dev/null || echo "0.0.0")
          GIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "ci-build")
          BUILD_DATE=$(date -u +%Y-%m-%d)
          # BUNDLED_UV_* placeholders must be substituted before VERSION_PLACEHOLDER,
          # which is a substring of BUNDLED_UV_VERSION_PLACEHOLDER.
          sed -e "s/BUNDLED_UV_VERSION_PLACEHOLDER//g" \
              -e "s/BUNDLED_UV_SHA256_PLACEHOLDER//g" \
              -e "s/VERSION_PLACEHOLDER/$VERSION/g" \
              -e "s/GIT_HASH_PLACEHOLDER/$GIT_HASH/g" \
              -e "s/BUILD_DATE_PLACEHOLDER/$BUILD_DATE/g" \
              Sources/VersionInfo.swift.template > Sources/Utilities/VersionInfo.swift
          echo "Generated Sources/Utilities/VersionInfo.swift"

      - name: Build
        run: swift build

      - name: Run Tests
        run: |
          # ONE run, parallel, with coverage.
          #
          # This used to run the whole suite twice — once `--parallel` for speed
          # and again `--no-parallel --enable-code-coverage`, on the belief that
          # llvm merges one .profraw per process and parallel workers race it.
          # Measured on 2830 tests: parallel reports 53.50% line coverage,
          # sequential 53.54% — 30 lines out of 92,525, which is ordinary
          # run-to-run variance (the waveform views feed random values into
          # their layout), not lost profile data. The second full run bought
          # nothing and doubled this job.
          #
          # Tests are isolated per process by AppDefaults' scratch suite, so
          # --parallel is safe here; see Sources/Stores/AppDefaults.swift.
          set -o pipefail
          swift test --parallel --enable-code-coverage 2>&1 | tee /tmp/test_output.txt
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          grep -v -E "(CNAccountCollection|ContactsPersistence|com\.apple\.contacts|NSXPCConnection|DetachedSignatures|FrontBoardServices|NSStatusItemScene|BSBlockSentinel|NSStatusItem|assertOnQueue)" /tmp/test_output.txt || true
          exit $TEST_EXIT_CODE
        env:
          OS_ACTIVITY_MODE: disable

      - name: Coverage gate
        if: always()
        run: |
          # Reads SwiftPM's codecov JSON rather than scraping `llvm-cov report`.
          #
          # The old gate did `... | tail -n 1 | awk '{print $(NF-1)}'`, and on the
          # TOTAL line $(NF-1) is MISSED BRANCHES, not line coverage — the line
          # percentage is several columns earlier. With no branch data the last
          # fields are "0  -", so the value never parsed, and the gate answered
          # "Could not parse coverage percent; skipping" and exited 0. It had
          # never enforced anything: the threshold was 60% while real line
          # coverage was 53.5%.
          #
          # Missing data is now an error, not a silent skip. A gate that cannot
          # find its input is broken, and should say so rather than pass.
          #
          # The threshold was also measuring the wrong thing. `data[0].totals`
          # spans every instrumented file, which includes the dependency sources
          # SwiftPM builds under .build/checkouts — 53.7% all-files against
          # 28.4% for our own code. That gate flattered us (most "covered" lines
          # were WhisperKit's, not ours) and was movable without touching a
          # test: a dependency bump can raise or lower it on its own. The gate
          # now scores Sources/ only, via scripts/coverage-gate.py.
          set -e
          COV_JSON=$(swift test --show-codecov-path 2>/dev/null || true)
          if [ -z "$COV_JSON" ] || [ ! -f "$COV_JSON" ]; then
            echo "::error::No coverage JSON at '${COV_JSON:-<empty>}'. The test step must run"
            echo "::error::with --enable-code-coverage for this gate to mean anything."
            exit 1
          fi

          # RATCHET, not an aspiration. 60 was aspirational and unenforced; a
          # threshold above the real number only stays green by being broken.
          # Raise this as coverage improves; never lower it to make CI pass.
          #
          # Clean macOS CI run 37583653445 measured 40.57% Sources-only coverage
          # (14870/36657 lines, 190 files) after removing app profiles. The 40%
          # floor leaves 0.57pp for environment-gated cases, not the former 13pp gap.
          python3 scripts/coverage-gate.py "$COV_JSON" "$PWD" 40


      - name: Export Swift coverage from the tested build
        run: |
          set -euo pipefail
          COV_JSON=$(swift test --show-codecov-path)
          PROFDATA="$(dirname "$COV_JSON")/default.profdata"
          # SwiftPM's native backend calls it AudioWhisperPackageTests;
          # XCBuild calls it AudioWhisperTests. Resolve the actual single bundle.
          BIN=$(python3 scripts/coverage-test-binary.py "$(swift build --show-bin-path)")
          test -s "$PROFDATA"
          test -f "$BIN"
          xcrun llvm-cov export -format=lcov "$BIN" -instr-profile "$PROFDATA" \
            --ignore-filename-regex='(\.build|/checkouts/|Tests/)' > coverage.lcov
          python3 scripts/lcov-to-sonar.py coverage.lcov sonar-coverage.xml "$PWD"
          python3 scripts/coverage-artifact.py create swift sonar-coverage.xml \
            --commit "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload tested Swift coverage
        uses: actions/upload-artifact@v4
        with:
          name: swift-coverage-${{ github.sha }}
          path: |
            sonar-coverage.xml
            sonar-coverage.xml.manifest.json
          if-no-files-found: error
          retention-days: 7

  lint:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint (pinned)
        run: |
          # PINNED, not `brew install swiftlint`.
          #
          # Homebrew always installs the latest, so the version drifted silently:
          # this repo's checked-in expectations were written against 0.63.x while
          # CI had moved to 0.65.0. The analyzer's unused_declaration heuristics
          # changed between them — the same tree reports 144 findings on 0.63.2
          # and 46 on 0.65.0. That is a 3x swing in a number the ratchet below
          # compares against, so an unrelated Homebrew bump could fail the build
          # for nobody's mistake, and local results would not match CI's either.
          #
          # Bump SWIFTLINT_VERSION deliberately, re-measure the ratchet baseline
          # in the same commit, and tell developers to match it locally:
          #   brew upgrade swiftlint   (or install the same release)
          set -euo pipefail
          curl -sSL --retry 3 -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q -o /tmp/swiftlint.zip -d /tmp/swiftlint
          echo "/tmp/swiftlint" >> "$GITHUB_PATH"
          /tmp/swiftlint/swiftlint version

      - name: SwiftLint (strict)
        run: swiftlint --strict --reporter github-actions-logging

      - name: No print() outside #if DEBUG
        run: |
          set -e
          violations=$(grep -rn --include='*.swift' -E '^\s*print\(' Sources/ | grep -v '//.*print' || true)
          # Filter out lines that appear inside a #if DEBUG block by checking surrounding lines.
          #
          # NOTE: the loop reads from a process substitution rather than a pipe.
          # `echo "$violations" | while ...` runs the loop body in a SUBSHELL, so
          # an `exit 1` inside it only terminates that subshell — the step then
          # falls through to the success echo and exits 0. This gate silently
          # passed on every run until that was fixed.
          failed=0
          if [ -n "$violations" ]; then
            while IFS=: read -r file line _rest; do
              [ -n "$file" ] || continue
              # Search 50 lines back for #if DEBUG, then check if a #endif came between
              ctx=$(sed -n "1,${line}p" "$file" | tail -n 50)
              last_debug=$(echo "$ctx" | grep -n '#if DEBUG' | tail -n 1 | cut -d: -f1 || true)
              last_endif=$(echo "$ctx" | grep -n '#endif' | tail -n 1 | cut -d: -f1 || true)
              if [ -z "$last_debug" ] || { [ -n "$last_endif" ] && [ "$last_endif" -gt "$last_debug" ]; }; then
                echo "::error file=$file,line=$line::print() outside #if DEBUG"
                failed=1
              fi
            done < <(echo "$violations")
          fi
          if [ "$failed" -ne 0 ]; then
            echo "Production print() found — wrap in #if DEBUG or use Logger."
            exit 1
          fi
          echo "No production print() found"

      - name: Python lockfile is in sync with pyproject.toml
        run: |
          # UvBootstrap ships uv.lock and installs with `uv sync --frozen`, which
          # never re-resolves. `--frozen` does NOT verify the lock matches
          # pyproject.toml, so drift would ship as a dependency that silently
          # fails to install. `uv lock --check` is the assertion that catches it.
          #
          # pipefail, the retries and the `command -v` check: a DNS blip on the
          # runner once failed the install download, `curl | sh` swallowed that
          # (without pipefail a pipeline's status is the last command's), and
          # the missing uv was then reported as "uv.lock is out of date" — on a
          # lock that was fine (master b92b2d4, run 37083650342).
          set -euo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf --retry 5 --retry-all-errors --retry-delay 5 https://astral.sh/uv/install.sh | sh || {
              echo "::error::Could not install uv; see the output above. The lockfile was not checked."
              exit 1
            }
            export PATH="$HOME/.local/bin:$PATH"
          fi
          command -v uv >/dev/null 2>&1 || {
            echo "::error::uv is not on PATH after installing it. The lockfile was not checked."
            exit 1
          }
          cd Sources/Resources
          if [ ! -f uv.lock ]; then
            echo "::error::Sources/Resources/uv.lock is missing. Run 'uv lock' there."
            exit 1
          fi
          uv lock --check || {
            echo "::error::uv lock --check failed; see its output above. If it says the lockfile needs updating, run 'uv lock' in Sources/Resources and commit the result."
            exit 1
          }
          echo "uv.lock is in sync with pyproject.toml"

      - name: Python type check (mypy --strict)
        run: |
          # Sources/ml is the only code here that ships without a compiler in
          # front of it — 574 lines in a subprocess behind a JSON-RPC boundary,
          # previously checked by nothing. The first --strict run found 28
          # errors, including _set_offline_env returning dict[str, str | None]
          # through an annotation that claimed dict[str, str] while its own
          # caller tested `is None`.
          #
          # Pinned (see MYPY_VERSION): mypy adds checks in minor releases, so an
          # unpinned upgrade turns CI red on code nobody touched.
          #
          # No app venv and no models needed — mypy.ini exempts the ML imports
          # per-module so this runs against a bare checkout in seconds. mypy
          # itself goes in a throwaway venv: PEP 668 marks the runner's Homebrew
          # python as externally managed, so a bare `pip install` is refused
          # (coverage collection uses the same venv below).
          set -euo pipefail
          python3 -m venv .mypy-venv
          .mypy-venv/bin/pip install --quiet --disable-pip-version-check "mypy==${MYPY_VERSION}"
          .mypy-venv/bin/mypy --version
          .mypy-venv/bin/mypy

      - name: Python unit tests
        run: |
          # Tests/test_correction_sanitize.py guards sanitize_model_output, the
          # function that decides whether a correction survives safeMerge or gets
          # silently thrown away. Every fixture in it is a verbatim capture of a
          # model output that DID get discarded, so a regression here is a silent
          # quality loss with no error anywhere.
          #
          # These were unreferenced by any workflow until now. They import
          # ml.correction, whose mlx imports are lazy, so plain system python is
          # enough — no uv, no venv, no model download.
          #
          # Tests/test_hub.py guards the two model-cache rules in ml/hub.py:
          # loads never touch the network, and a pinned download is visible to
          # offline lookup. It runs against a fake huggingface_hub, so it too
          # needs only system python.
          #
          # Tests/test_rpc.py covers the daemon's request handling and wire
          # validation (ml.rpc, ml.protocol) with the model calls faked.
          #
          # Tests/test_verify_scripts.py runs verify_parakeet.py and
          # verify_mlx.py (the Settings "Verify" buttons) against fake model
          # libraries: offline hit, pinned download on a miss, and each error.
          set -e
          .mypy-venv/bin/pip install --quiet --disable-pip-version-check "coverage==${COVERAGE_VERSION}" "tqdm==4.67.1"
          .mypy-venv/bin/python -m coverage run --source=Sources -m unittest discover -s Tests -p 'test_*.py'
          .mypy-venv/bin/python -m coverage xml -o coverage-python.xml
          python3 -m unittest scripts/test_unattended_acceptance.py
          python3 scripts/coverage-artifact.py create python coverage-python.xml \
            --commit "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload tested Python coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ github.sha }}
          path: |
            coverage-python.xml
            coverage-python.xml.manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: TODO/FIXME audit (warn only)
        run: |
          grep -rn "TODO\|FIXME" Sources/ --include='*.swift' || echo "No TODO/FIXME comments found"

  bundle-smoke-test:
    needs: build-and-test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Select the NEWEST Xcode, not the newest 16.x. This used to pin to
          # Xcode_16*, written when 16 was current — but KeyboardShortcuts 3.x
          # declares swift-tools-version 6.2, which Xcode 16 cannot resolve
          # ("incompatible tools version"). Runners carry Xcode 26.x alongside
          # 16.x, so take the highest available and let the floor be enforced by
          # the packages themselves.
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest/Contents/Developer"
          else
            xcode-select -p
          fi

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build .app bundle via make build
        run: make build

      - name: Verify bundle structure
        run: |
          set -e
          APP="AudioWhisper.app"
          test -d "$APP" || { echo "::error::Missing $APP"; exit 1; }
          test -x "$APP/Contents/MacOS/AudioWhisper" || { echo "::error::Missing executable"; exit 1; }
          test -f "$APP/Contents/Info.plist" || { echo "::error::Missing Info.plist"; exit 1; }
          plutil -lint "$APP/Contents/Info.plist"
          # A linker-only signature leaves the bundle unidentified to TCC.
          # Local previews also need a complete, verified bundle signature.
          codesign --verify --strict --verbose "$APP"
          codesign -d -r- "$APP" 2>&1 | grep -q 'designated =>'
          codesign -dv "$APP" 2>&1 | grep -q '^Identifier=com.audiowhisper.rebuild$'
          # Confirm Python bootstrap binary made it into the bundle
          test -f "$APP/Contents/Resources/bin/uv" -o -f "$APP/Contents/Resources/uv" \
            || echo "::warning::uv binary not found in bundled Resources (may be missing for dev builds)"
          # The Python entry points the app launches, and the package they all
          # import. A missing one is not a build error — it surfaces at runtime
          # as a model that can never be downloaded, verified, or loaded.
          for py in ml_daemon.py download_model.py verify_parakeet.py verify_mlx.py ml/hub.py ml/rpc.py; do
            test -f "$APP/Contents/Resources/$py" || { echo "::error::Missing bundled Resources/$py"; exit 1; }
          done
          # Opening Preferences creates the shortcut recorder, which resolves
          # its localized text through Bundle.module. Missing resources trap at
          # runtime even when the executable and headless tests pass.
          for bundle in AudioWhisper_AudioWhisper KeyboardShortcuts_KeyboardShortcuts; do
            test -d "$APP/Contents/Resources/$bundle.bundle" \
              || { echo "::error::Missing SwiftPM resource bundle $bundle"; exit 1; }
          done
          # SwiftPM versions package macOS resources in either a flat bundle
          # or Contents/Resources. Validate runtime resolution through Foundation.
          xcrun swift -e 'import Foundation; let path = "AudioWhisper.app/Contents/Resources/KeyboardShortcuts_KeyboardShortcuts.bundle"; guard let bundle = Bundle(path: path), let url = bundle.url(forResource: "Localizable", withExtension: "strings", subdirectory: nil, localization: "en"), FileManager.default.fileExists(atPath: url.path) else { fatalError("Missing shortcut editor localization") }'
          # Confirm version was stamped (not left as a placeholder)
          if grep -q "VERSION_PLACEHOLDER\|BUILD_PLACEHOLDER" "$APP/Contents/MacOS/AudioWhisper" 2>/dev/null; then
            echo "::warning::Version placeholders found unsubstituted in binary"
          fi
          echo "App bundle smoke test passed."

      - name: Run read-only recording diagnostics from the packaged app
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          result = subprocess.run(
              ["AudioWhisper.app/Contents/MacOS/AudioWhisper", "--diagnose-recording"],
              capture_output=True, text=True, timeout=30, check=True,
          )
          report = json.loads(result.stdout)
          assert report["bundleIdentifier"] == "com.audiowhisper.rebuild", report
          assert report["build"] == os.environ["GITHUB_SHA"], report
          assert report["launchContext"] == "commandLine", report
          assert report["nextStep"], report
          if report["microphonePermission"] != "granted":
              assert not report["readyToRecord"], report
          print("Packaged recording diagnostics exited cleanly and reported valid setup state")
          PY

      - name: Show bundle size
        run: |
          du -sh AudioWhisper.app
          ls -lh AudioWhisper.app/Contents/MacOS/AudioWhisper

  # There is deliberately no snapshot job.
  #
  # Turning the suite on in CI once was worthwhile — it found a real crash,
  # DialWaveformView trapping on an empty frequencyBands array (fixed in this
  # branch, now covered by a direct render test in WaveformViewsTests). But the
  # job could never do more than that. A GitHub runner has no usable
  # WindowServer, so it draws AppKit-backed controls as the yellow "cannot
  # render" placeholder and whole views as flat rectangles: measured
  # 2026-08-01, all 34 renders it produced diverged from the local baselines by
  # 19-100% of pixels. The comparison step could only ever be report-only, and
  # its artifact looked authoritative while being a picture of a broken render.
  #
  # Snapshots are a local-only tool: SNAPSHOT_TESTS=1 to check,
  # SNAPSHOT_RECORD=1 to re-record. See Tests/SnapshotTestCase.swift.
  analyze:
    name: SwiftLint analyze
    runs-on: macos-15
    # xcodebuild build-for-testing plus a full analyze pass. 30 was too tight
    # even after dropping from three analyze runs to one.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Select the NEWEST Xcode, not the newest 16.x. This used to pin to
          # Xcode_16*, written when 16 was current — but KeyboardShortcuts 3.x
          # declares swift-tools-version 6.2, which Xcode 16 cannot resolve
          # ("incompatible tools version"). Runners carry Xcode 26.x alongside
          # 16.x, so take the highest available and let the floor be enforced by
          # the packages themselves.
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          swift --version

      - name: Install SwiftLint (pinned)
        run: |
          # PINNED, not `brew install swiftlint`.
          #
          # Homebrew always installs the latest, so the version drifted silently:
          # this repo's checked-in expectations were written against 0.63.x while
          # CI had moved to 0.65.0. The analyzer's unused_declaration heuristics
          # changed between them — the same tree reports 144 findings on 0.63.2
          # and 46 on 0.65.0. That is a 3x swing in a number the ratchet below
          # compares against, so an unrelated Homebrew bump could fail the build
          # for nobody's mistake, and local results would not match CI's either.
          #
          # Bump SWIFTLINT_VERSION deliberately, re-measure the ratchet baseline
          # in the same commit, and tell developers to match it locally:
          #   brew upgrade swiftlint   (or install the same release)
          set -euo pipefail
          curl -sSL --retry 3 -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q -o /tmp/swiftlint.zip -d /tmp/swiftlint
          echo "/tmp/swiftlint" >> "$GITHUB_PATH"
          /tmp/swiftlint/swiftlint version

      - name: Generate VersionInfo.swift
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION 2>/dev/null || echo "0.0.0")
          sed -e "s/BUNDLED_UV_VERSION_PLACEHOLDER//g" \
              -e "s/BUNDLED_UV_SHA256_PLACEHOLDER//g" \
              -e "s/VERSION_PLACEHOLDER/$VERSION/g" \
              -e "s/GIT_HASH_PLACEHOLDER/$(git rev-parse --short HEAD)/g" \
              -e "s/BUILD_DATE_PLACEHOLDER/$(date -u +%Y-%m-%d)/g" \
              Sources/VersionInfo.swift.template > Sources/Utilities/VersionInfo.swift

      - name: Build with xcodebuild (analyzer needs a compiler log)
        run: |
          # `swift build -v` does NOT emit a log swiftlint can parse — SPM's new
          # build system omits the per-file swiftc invocations the analyzer
          # reads, and it errors with "Cannot index file at path ...".
          # xcodebuild does produce a compatible log. build-for-testing is used
          # so Tests/ are included; without them every *ForTesting helper is
          # reported as unused.
          set -o pipefail
          xcodebuild -scheme AudioWhisper -destination 'platform=macOS' \
            build-for-testing 2>&1 | tee xcodebuild.log | tail -5

      - name: Analyze and gate (single pass)
        run: python3 scripts/analyze-gate.py xcodebuild.log --baseline 30

      - name: Retain analyzer report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-${{ github.sha }}
          path: |
            analyze.json
            analyze.stderr.txt
          if-no-files-found: warn

  sonarcloud:
    name: SonarCloud Scan
    needs: [build-and-test, lint]
    # Match the former Sonar workflow's master/PR scope and secret boundary.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'pull_request' && github.base_ref == 'master'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: swift-coverage-${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: python-coverage-${{ github.sha }}
      - name: Verify tested coverage provenance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/coverage-artifact.py verify swift sonar-coverage.xml \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          python3 scripts/coverage-artifact.py verify python coverage-python.xml \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >-
            -Dsonar.coverageReportPaths=sonar-coverage.xml
            -Dsonar.python.coverage.reportPaths=coverage-python.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
