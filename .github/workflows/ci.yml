name: CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode || true

      - name: Select Xcode
        run: |
          # Prefer newer Xcode versions for latest Swift/SDK support
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          else
            echo "Using default Xcode"
            xcode-select -p
          fi

      - name: Show Swift Version
        run: swift --version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Generate VersionInfo.swift
        run: |
          # Generate VersionInfo.swift from template (required for build)
          mkdir -p Sources/Utilities
          GIT_HASH=$(git rev-parse HEAD 2>/dev/null || echo "ci-build")
          BUILD_DATE=$(date '+%Y-%m-%d')
          VERSION=$(cat VERSION 2>/dev/null | tr -d '[:space:]' || echo "0.0.0")
          sed -e "s/VERSION_PLACEHOLDER/$VERSION/g" \
              -e "s/GIT_HASH_PLACEHOLDER/$GIT_HASH/g" \
              -e "s/BUILD_DATE_PLACEHOLDER/$BUILD_DATE/g" \
              Sources/VersionInfo.swift.template > Sources/Utilities/VersionInfo.swift
          echo "Generated VersionInfo.swift with version $VERSION"

      - name: Build
        run: |
          echo "=== Starting Build ==="
          echo "Contents of Sources/Utilities/:"
          ls -la Sources/Utilities/ || echo "Directory not found"
          cat Sources/Utilities/VersionInfo.swift || echo "VersionInfo.swift not found"
          echo ""
          echo "=== Resolving Swift package dependencies ==="
          swift package resolve 2>&1 | tee build_output.txt
          echo ""
          echo "=== Running swift build ==="
          swift build 2>&1 | tee -a build_output.txt || {
            echo ""
            echo "=== BUILD FAILED ==="
            echo "Build output saved to build_output.txt"
            echo "## Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 build_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build_output.txt
          retention-days: 5

      - name: Run Tests
        run: |
          # Tests use AudioWhisperLib (library target) to avoid executable testing issues
          export OS_ACTIVITY_MODE=disable

          echo "=== Swift Package Structure ==="
          swift package describe 2>&1 || true

          echo ""
          echo "=== Building Test Bundle ==="
          # Build tests separately to isolate build vs runtime issues
          swift build --build-tests -Xswiftc -DTESTING 2>&1 | tee test_output.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Test build exit code: $BUILD_EXIT"

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "Test bundle build failed"
            exit $BUILD_EXIT
          fi

          echo ""
          echo "=== Test Bundle Info ==="
          find .build -name "*.xctest" -type d 2>/dev/null | head -5 || true
          ls -la .build/debug/*.xctest 2>/dev/null || echo "No xctest bundles found in debug"

          echo ""
          echo "=== Running Tests with xcodebuild ==="
          # Try xcodebuild which handles test hosting better
          xcodebuild test \
            -scheme AudioWhisper \
            -destination 'platform=macOS' \
            -only-testing:AudioWhisperTests/ColorHexTests \
            2>&1 | tee -a test_output.txt || {
              echo ""
              echo "xcodebuild failed, trying swift test..."
              swift test --filter ColorHexTests -Xswiftc -DTESTING 2>&1 | tee -a test_output.txt
            }
          TEST_EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "=== Test Summary ==="
          grep -E "(Test Suite|Test Case|passed|failed|error:|Executed|skipped|PASS|FAIL)" test_output.txt || true

          exit $TEST_EXIT_CODE
        env:
          CI: "true"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test_output.txt
          retention-days: 5

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for debug print statements
        run: |
          echo "Checking for print statements in Swift source files..."
          # Find print statements but exclude comments and Python files
          if grep -rn "print(" Sources/ --include="*.swift" | grep -v "//.*print" | grep -v "\.py:"; then
            echo "::warning::Found print statements that may need review"
          else
            echo "No problematic print statements found"
          fi

      - name: Check for TODO/FIXME comments
        run: |
          echo "Checking for TODO/FIXME comments..."
          grep -rn "TODO\|FIXME" Sources/ --include="*.swift" || echo "No TODO/FIXME comments found"
