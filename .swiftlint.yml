included:
  - Sources
  - Tests

excluded:
  - .build
  - AudioWhisper.app
  - Sources/Resources

opt_in_rules:
  - empty_count
  - fatal_error_message
  - toggle_bool

analyzer_rules:
  - unused_import
  - unused_declaration

line_length:
  warning: 130
  error: 160
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

function_body_length:
  warning: 80
  error: 120

type_body_length:
  warning: 250
  error: 320

file_length:
  warning: 600
  error: 900

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length: 2
  excluded:
    - id
    - ok
    - to
    - on
    - up
    - ui
    - os
    - ml
    - db
    - vc
    - qr
    - ip

type_name:
  max_length: 60

trailing_whitespace:
  ignores_empty_lines: true
  ignores_comments: true

nesting:
  type_level: 3

custom_rules:
  # C3/G1: `Timer.publish(...).autoconnect()` starts the moment a view is
  # created and never stops — including for off-screen views. Use FrameTimer,
  # which is driven from onAppear/onDisappear and actually cancels.
  # FrameTimer.swift is the one legitimate site and is excluded below.
  no_autoconnected_timer:
    name: "Autoconnected Timer"
    regex: 'Timer\.publish\([^)]*\)[\s\S]{0,40}?\.autoconnect\(\)'
    # No `match_kinds`: [identifier] suppresses real code too (the match spans
    # numbers and argument labels), and `none` is not a valid kind. So the regex
    # also matches prose that quotes the pattern — keep such prose out of
    # Sources/, and exclude the two files where it legitimately appears.
    message: "Use FrameTimer (start/stop from onAppear/onDisappear) — an autoconnected timer runs forever, even off-screen."
    severity: warning
    excluded:
      # Its doc comment quotes the pattern it exists to replace.
      - ".*/FrameTimer\\.swift"
      # Preview-only helper with its own explicit start()/stop() lifecycle.
      - ".*/WaveformPreviewHelpers\\.swift"

reporter: "xcode"
